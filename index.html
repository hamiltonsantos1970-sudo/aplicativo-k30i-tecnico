<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K30i - Interface Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --topo: #ffffff; --fundo: #efeae2; --balao-eu: #d9fdd3; --balao-ele: #ffffff;
            --texto: #111b21; --subtitulo: #667781; --accent: #25d366; --borda: #e9edef;
            --danger: #ff3b30; --status-cor: #25a244;
        }
        body.dark-mode {
            --topo: #202c33; --fundo: #0b141a; --balao-eu: #005c4b; --balao-ele: #202c33;
            --texto: #e9edef; --subtitulo: #8696a0; --accent: #00a884; --borda: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100dvh; width: 100vw; background-color: var(--fundo); display: flex; flex-direction: column; overflow: hidden; }

        header { height: 60px; background: var(--topo); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid var(--borda); flex-shrink: 0; }
        .perfil { display: flex; align-items: center; gap: 10px; }
        .foto { width: 40px; height: 40px; border-radius: 50%; background: #1a7a35; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .status-online { color: var(--status-cor); font-size: 10px; font-weight: bold; }

        #drawer { position: fixed; top: 60px; left: 0; width: 100%; background: var(--topo); z-index: 900; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-bottom: 1px solid var(--borda); transform: translateY(0); }
        #drawer.recolhido { transform: translateY(-100%); }
        .grid-atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
        
        .card { background: var(--balao-ele); padding: 10px 5px; border-radius: 10px; text-align: center; color: var(--texto); font-size: 10px; border: 1.5px solid var(--borda); font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card i { display: block; font-size: 18px; margin-bottom: 5px; color: var(--accent); }
        
        .alca { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); height: 24px; width: 50px; background: var(--topo); border-radius: 0 0 12px 12px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--borda); border-top: none; cursor: pointer; }

        #chat { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 15px; color: var(--texto); box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; line-height: 1.4; animation: popIn 0.3s ease; }
        .eu { align-self: flex-end; background: var(--balao-eu); border-top-right-radius: 0; }
        .ele { align-self: flex-start; background: var(--balao-ele); border-top-left-radius: 0; }
        .tempo { font-size: 10px; color: var(--subtitulo); text-align: right; margin-top: 4px; display: block; }

        footer { padding: 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .input-falso { flex: 1; background: var(--topo); border-radius: 25px; padding: 12px 18px; color: var(--subtitulo); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .btn-mic { width: 52px; height: 52px; border-radius: 50%; border: none; background: #25a244; color: white; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .listening { animation: pulse 1.5s infinite; background: var(--danger) !important; }

        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }
    </style>
</head>
<body>

    <header>
        <div class="perfil">
            <div class="foto">K</div>
            <div>
                <b style="color:var(--texto)">Suporte K30i</b><br>
                <span class="status-online">● ONLINE v1.50</span>
            </div>
        </div>
        <i class="fa-solid fa-moon" id="theme-btn" style="color:var(--subtitulo); font-size: 20px; cursor:pointer;" onclick="alternarTema()"></i>
    </header>

    <div id="drawer">
        <div class="grid-atalhos">
            <div class="card" onclick="processarComando('RESET DE FALHA')">
                <i class="fa-solid fa-rotate"></i>Reset de falha
            </div>
            
            <div class="card" onclick="processarComando('AVISO ATIVO')"><i class="fa-solid fa-triangle-exclamation"></i>AVISO</div>
            <div class="card" onclick="processarComando('PROGRAMAÇÃO')"><i class="fa-solid fa-gear"></i>PROG.</div>
            <div class="card" onclick="processarComando('LEDS PAINEL')"><i class="fa-solid fa-lightbulb"></i>LEDS</div>
        </div>
        <div class="alca" onclick="toggleGaveta()"><i id="seta-gaveta" class="fa-solid fa-chevron-up"></i></div>
    </div>

    <main id="chat"></main>

    <footer>
        <div class="input-falso">
            <span id="label-status">Mensagem</span>
            <i class="fa-solid fa-paperclip" style="transform: rotate(-45deg);"></i>
        </div>
        <button class="btn-mic" id="btn-voz"><i class="fa-solid fa-microphone"></i></button>
    </footer>

    <script>
        // BANCO DE DADOS - RECUPERADO FIELMENTE DO SEU ARQUIVO INDEX(4)
        const BANCO = {
            "reset de falha": "Para realizar o **RESET DE FALHA**, siga exatamente estes passos:\n\n1. Verifique no display se a mensagem de erro ainda persiste.\n2. Mantenha a tecla **ESC** pressionada por cerca de **3 segundos** até que o alarme sonoro pare ou a mensagem desapareça.\n3. Se o erro persistir, será necessário desligar o disjuntor geral por **10 segundos** e ligar novamente.\n4. Caso a falha volte imediatamente, não force a partida e consulte o suporte avançado.",
            "aviso ativo": "🔔 **AVISO ATIVO**\nO sistema identificou uma condição de alerta. Verifique os sensores e o nível de óleo antes de prosseguir.",
            "programação": "⚙️ **ACESSO À PROGRAMAÇÃO**\n\n1. Pressione **ENTER** por 5 segundos.\n2. Use as setas para navegar nos parâmetros.\n3. Pressione **ENTER** para confirmar o valor desejado.",
            "leds painel": "💡 **ESTADO DOS LEDS**\n🟢 **RUN:** Sistema em operação.\n🔴 **FAULT:** Existe uma falha ativa.\n🟡 **AUTO:** Modo automático selecionado."
        };

        function adicionarMensagem(texto, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerHTML = texto.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') + 
                            `<span class="tempo">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function processarComando(txt) {
            if(!txt) return;
            adicionarMensagem(txt, 'eu');
            setTimeout(() => {
                const busca = txt.toLowerCase();
                let r = "Informação não localizada. Tente utilizar os botões de atalho no topo.";
                
                for (let chave in BANCO) {
                    if (busca.includes(chave)) {
                        r = BANCO[chave];
                        break;
                    }
                }
                adicionarMensagem(r, 'ele');
            }, 600);
        }

        function toggleGaveta() {
            const d = document.getElementById('drawer');
            const s = document.getElementById('seta-gaveta');
            d.classList.toggle('recolhido');
            s.className = d.classList.contains('recolhido') ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
        }

        function alternarTema() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-btn');
            btn.className = document.body.classList.contains('dark-mode') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        window.onload = () => {
            adicionarMensagem("Olá! Sou seu suporte técnico K30i. Como posso ajudar agora?", 'ele');
            setTimeout(toggleGaveta, 1000);
        };
    </script>
</body>
</html>
