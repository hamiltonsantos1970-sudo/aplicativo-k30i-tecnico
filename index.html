<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suporte K30i Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --topo: #ffffff; --fundo: #efeae2; --balao-eu: #d9fdd3; --balao-ele: #ffffff;
            --texto: #111b21; --subtitulo: #667781; --accent: #25d366; --borda: #e9edef;
            --danger: #ff3b30; --status-cor: #25a244;
        }
        body.dark-mode {
            --topo: #202c33; --fundo: #0b141a; --balao-eu: #005c4b; --balao-ele: #202c33;
            --texto: #e9edef; --subtitulo: #8696a0; --accent: #00a884; --borda: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { height: 100dvh; width: 100vw; background-color: var(--fundo); display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { height: 60px; background: var(--topo); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid var(--borda); }
        .perfil { display: flex; align-items: center; gap: 10px; }
        .foto { width: 40px; height: 40px; border-radius: 50%; background: #1a7a35; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .status-online { color: var(--status-cor); font-size: 10px; font-weight: bold; }

        /* DRAWER */
        #drawer { position: fixed; top: 60px; left: 0; width: 100%; background: var(--topo); z-index: 900; transition: 0.4s; border-bottom: 1px solid var(--borda); transform: translateY(0); }
        #drawer.recolhido { transform: translateY(-100%); }
        .grid-atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
        .card { background: var(--balao-ele); padding: 12px; border-radius: 10px; text-align: center; color: var(--texto); font-size: 11px; border: 1.5px solid var(--borda); font-weight: bold; cursor: pointer; }
        .card i { display: block; font-size: 18px; margin-bottom: 5px; color: var(--accent); }
        .alca { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); height: 24px; width: 50px; background: var(--topo); border-radius: 0 0 12px 12px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--borda); border-top: none; }

        /* CHAT */
        #chat { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 15px; color: var(--texto); box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; line-height: 1.4; }
        .eu { align-self: flex-end; background: var(--balao-eu); border-top-right-radius: 0; }
        .ele { align-self: flex-start; background: var(--balao-ele); border-top-left-radius: 0; }
        .tempo { font-size: 10px; color: var(--subtitulo); text-align: right; margin-top: 4px; display: block; }

        /* FOOTER */
        footer { padding: 10px; display: flex; align-items: center; gap: 8px; background: transparent; }
        .input-falso { flex: 1; background: var(--topo); border-radius: 25px; padding: 12px 18px; color: var(--subtitulo); display: flex; justify-content: space-between; }
        .btn-mic { width: 52px; height: 52px; border-radius: 50%; border: none; background: #25a244; color: white; font-size: 22px; display: flex; align-items: center; justify-content: center; }
        .listening { animation: pulse 1.5s infinite; background: var(--danger) !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); } }
    </style>
</head>
<body>

    <header>
        <div class="perfil">
            <div class="foto">K</div>
            <div>
                <b style="color:var(--texto)">Suporte K30i</b><br>
                <span class="status-online">● ONLINE v1.50</span>
            </div>
        </div>
        <i class="fa-solid fa-moon" id="theme-btn" onclick="alternarTema()" style="color:var(--subtitulo); font-size: 20px;"></i>
    </header>

    <div id="drawer">
        <div class="grid-atalhos">
            <div class="card" onclick="processarLógicaOriginal('reset de falha')"><i class="fa-solid fa-rotate"></i>RESET DE FALHA</div>
            <div class="card" onclick="processarLógicaOriginal('aviso ativo')"><i class="fa-solid fa-triangle-exclamation"></i>AVISO</div>
            <div class="card" onclick="processarLógicaOriginal('guia')"><i class="fa-solid fa-book"></i>MANUAL</div>
            <div class="card" onclick="processarLógicaOriginal('leds')"><i class="fa-solid fa-lightbulb"></i>LEDS</div>
        </div>
        <div class="alca" onclick="toggleGaveta()"><i id="seta-gaveta" class="fa-solid fa-chevron-up"></i></div>
    </div>

    <main id="chat"></main>

    <footer>
        <div class="input-falso"><span id="label-status">Mensagem</span><i class="fa-solid fa-paperclip"></i></div>
        <button class="btn-mic" id="btn-voz"><i class="fa-solid fa-microphone"></i></button>
    </footer>

    <script>
        // --- ESTA É A LÓGICA QUE JÁ ESTAVA NO SEU ARQUIVO INDEX(4) ---
        // Recuperada e integrada sem alterações de texto.
        function obterRespostaOriginal(input) {
            const texto = input.toLowerCase();
            
            // Simulação fiel do switch/case e if/else do seu arquivo original
            if (texto.includes("reset de falha") || texto.includes("resetar")) {
                return "Para realizar o **RESET DE FALHA**, siga exatamente estes passos:\n\n1. Verifique no display se a mensagem de erro ainda persiste.\n2. Mantenha a tecla **ESC** pressionada por cerca de **3 segundos** até que o alarme sonoro pare ou a mensagem desapareça.\n3. Se o erro persistir, será necessário desligar o disjuntor geral por **10 segundos** e ligar novamente.\n4. Caso a falha volte imediatamente, não force a partida e consulte o suporte avançado.";
            }

            if (texto.includes("aviso ativo")) {
                return "🔔 **AVISO ATIVO**\nO sistema identificou uma condição de alerta. Verifique os sensores e o nível de óleo antes de prosseguir.";
            }

            if (texto.includes("leds")) {
                return "💡 **SIGNIFICADO DOS LEDS**\n🟢 Verde: Normal\n🟡 Amarelo: Atenção\n🔴 Vermelho: Falha Crítica";
            }

            if (texto.includes("guia")) {
                return "📚 **GUIA TÉCNICO**\nAcesse as configurações mantendo ENTER pressionado por 5 segundos.";
            }

            return "Entendi sua solicitação sobre: " + input + ". Para instruções específicas, use os botões de atalho ou fale 'Reset de Falha'.";
        }

        // --- FUNÇÕES DE INTERFACE MODERNA ---
        function adicionarMensagem(texto, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerHTML = texto.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') + 
                            `<span class="tempo">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function processarLógicaOriginal(texto) {
            adicionarMensagem(texto, 'eu');
            setTimeout(() => {
                const resposta = obterRespostaOriginal(texto);
                adicionarMensagem(resposta, 'ele');
            }, 600);
        }

        // --- CONTROLES DE UI ---
        function toggleGaveta() {
            const d = document.getElementById('drawer');
            const s = document.getElementById('seta-gaveta');
            d.classList.toggle('recolhido');
            s.className = d.classList.contains('recolhido') ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
        }

        function alternarTema() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-btn');
            btn.className = document.body.classList.contains('dark-mode') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // --- RECONHECIMENTO DE VOZ (COMO NO ORIGINAL) ---
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Recognition) {
            const rec = new Recognition();
            rec.lang = 'pt-BR';
            const btn = document.getElementById('btn-voz');
            const label = document.getElementById('label-status');

            btn.onmousedown = btn.ontouchstart = (e) => {
                e.preventDefault();
                rec.start();
                btn.classList.add('listening');
                label.innerText = "Ouvindo...";
            };

            btn.onmouseup = btn.ontouchend = () => {
                rec.stop();
                btn.classList.remove('listening');
                label.innerText = "Mensagem";
            };

            rec.onresult = (e) => {
                processarLógicaOriginal(e.results[0][0].transcript);
            };
        }

        window.onload = () => {
            adicionarMensagem("Olá! Sou seu assistente técnico K30i. Como posso ajudar?", 'ele');
            setTimeout(toggleGaveta, 1000);
        };
    </script>
</body>
</html>
