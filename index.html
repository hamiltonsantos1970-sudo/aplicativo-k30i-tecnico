<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="K30i Pro">
    <title>K30i - Interface Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --topo: #ffffff; --fundo: #efeae2; --balao-eu: #d9fdd3; --balao-ele: #ffffff;
            --texto: #111b21; --subtitulo: #667781; --accent: #25d366; --borda: #e9edef;
            --danger: #ff3b30; --status-cor: #25a244;
        }
        body.dark-mode {
            --topo: #202c33; --fundo: #0b141a; --balao-eu: #005c4b; --balao-ele: #202c33;
            --texto: #e9edef; --subtitulo: #8696a0; --accent: #00a884; --borda: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100dvh; width: 100vw; background-color: var(--fundo); display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { height: 60px; background: var(--topo); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid var(--borda); flex-shrink: 0; }
        .perfil { display: flex; align-items: center; gap: 10px; }
        .foto { width: 40px; height: 40px; border-radius: 50%; background: #1a7a35; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .status-online { color: var(--status-cor); font-size: 10px; font-weight: bold; }

        /* DRAWER (GAVETA DE ATALHOS) */
        #drawer { position: fixed; top: 60px; left: 0; width: 100%; background: var(--topo); z-index: 900; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-bottom: 1px solid var(--borda); transform: translateY(0); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        #drawer.recolhido { transform: translateY(-100%); }
        .grid-atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
        .card { background: var(--balao-ele); padding: 12px; border-radius: 10px; text-align: center; color: var(--texto); font-size: 11px; border: 1.5px solid var(--borda); font-weight: bold; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); background: var(--borda); }
        .card i { display: block; font-size: 18px; margin-bottom: 5px; color: var(--accent); }
        .alca { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); height: 24px; width: 50px; background: var(--topo); border-radius: 0 0 12px 12px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--borda); border-top: none; cursor: pointer; }

        /* CHAT */
        #chat { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .msg { 
            max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 15px; color: var(--texto); 
            box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; line-height: 1.4; white-space: pre-wrap;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .eu { align-self: flex-end; background: var(--balao-eu); border-top-right-radius: 0; }
        .ele { align-self: flex-start; background: var(--balao-ele); border-top-left-radius: 0; }
        .tempo { font-size: 10px; color: var(--subtitulo); text-align: right; margin-top: 4px; display: block; }
        
        /* Estilos de conteúdo técnico */
        .tag-alerta { background: #fff3cd; color: #856404; padding: 5px; border-radius: 4px; border-left: 4px solid #ffeeba; margin: 5px 0; font-size: 13px; }
        .btn-inline { background: #e9edef; border: 1px solid #ced4da; padding: 6px 12px; border-radius: 15px; font-size: 13px; margin: 5px 5px 0 0; display: inline-block; cursor: pointer; color: #111b21; font-weight: 500; }
        body.dark-mode .btn-inline { background: #374045; color: #e9edef; border-color: #4a555a; }

        /* RODAPÉ E MICROFONE */
        footer { padding: 10px; display: flex; align-items: center; gap: 8px; background: transparent; flex-shrink: 0; }
        .input-falso { flex: 1; background: var(--topo); border-radius: 25px; padding: 12px 18px; color: var(--subtitulo); font-size: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        
        .gravando-texto { color: var(--danger) !important; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .btn-mic { width: 52px; height: 52px; border-radius: 50%; border: none; background: #25a244; color: white; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .listening { animation: pulse 1.5s infinite; background: var(--danger) !important; transform: scale(1.1); }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="perfil">
            <div class="foto">K</div>
            <div>
                <b style="color:var(--texto)">Suporte K30i</b><br>
                <span class="status-online">● ONLINE v1.50</span>
            </div>
        </div>
        <i class="fa-solid fa-moon" id="theme-btn" style="color:var(--subtitulo); font-size: 20px; cursor:pointer;" onclick="alternarTema()"></i>
    </header>

    <div id="drawer">
        <div class="grid-atalhos">
            <div class="card" onclick="processarComando('FALHA ATIVA')"><i class="fa-solid fa-bug"></i>FALHA</div>
            <div class="card" onclick="processarComando('AVISO ATIVO')"><i class="fa-solid fa-triangle-exclamation"></i>AVISO</div>
            <div class="card" onclick="processarComando('GUIA INSTALAÇÃO')"><i class="fa-solid fa-book"></i>MANUAL</div>
            <div class="card" onclick="processarComando('RESET GERAL')"><i class="fa-solid fa-rotate"></i>RESET</div>
        </div>
        <div class="alca" onclick="toggleGaveta()"><i id="seta-gaveta" class="fa-solid fa-chevron-up"></i></div>
    </div>

    <main id="chat"></main>

    <footer>
        <div class="input-falso">
            <span id="label-status">Segure para falar</span>
            <i class="fa-solid fa-paperclip" style="transform: rotate(-45deg);"></i>
        </div>
        <button class="btn-mic" id="btn-voz">
            <i class="fa-solid fa-microphone"></i>
        </button>
    </footer>
